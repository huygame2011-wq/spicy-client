name: Build Spicy Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q spicy-client.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build --no-daemon
        working-directory: spicy-client
      - uses: actions/upload-artifact@v4
        with:
          name: spicy-client-jar
          path: |
            spicy-client/build/libs/*.jar
            !spicy-client/build/libs/*-sources.jar
